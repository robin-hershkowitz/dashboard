<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleaning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1814;
    --card-bg: #242018;
    --border: rgba(255,247,235,0.12);
    --text: #f5efe4;
    --text-secondary: #9a9186;
    --accent: #a89cf7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    padding: 32px 24px 80px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 28px;
  }
  .header h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 34px;
    font-weight: 600;
    font-style: italic;
    color: var(--accent);
    letter-spacing: -0.01em;
  }
  .header .date {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* Progress */
  .progress-wrap {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 24px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .progress-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
  }
  .progress-count {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }
  .progress-track {
    height: 8px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .celebrate {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    margin-top: 8px;
    height: 18px;
  }

  /* Confetti */
  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
  }

  /* Grid */
  .grid {
    column-width: 240px;
    column-gap: 14px;
  }

  /* Card */
  .card {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-left: 5px solid var(--card-color, var(--accent));
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    break-inside: avoid;
    display: inline-block;
    width: 100%;
    transition: opacity 0.3s;
  }
  .card.done { opacity: 0.55; }
  .card.done .card-title { text-decoration: line-through; text-decoration-color: var(--card-color, var(--accent)); }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .card-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--card-color, var(--text));
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .swatch {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--card-color, var(--accent));
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .done-check {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--card-color, var(--accent));
    background: transparent;
    color: var(--card-color, var(--accent));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: background 0.12s, color 0.12s;
    flex-shrink: 0;
  }
  .done-check.active { background: var(--card-color, var(--accent)); color: #fff; }

  .timer-display {
    font-family: 'Fraunces', serif;
    font-size: 36px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 10px;
    text-align: center;
  }
  .timer-display.running { color: var(--card-color, var(--accent)); }
  .timer-display.done-time { color: #10b981; }

  .timer-controls { display: flex; gap: 6px; }
  .btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: 2px solid transparent;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.06s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-start { background: var(--card-color, var(--accent)); color: #fff; border-color: var(--card-color, var(--accent)); }
  .btn-start:hover { filter: brightness(1.1); }
  .btn-reset { background: transparent; color: var(--text-secondary); border-color: var(--border); }
  .btn-reset:hover { border-color: var(--text-secondary); color: var(--text); }

  .card-note {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 8px;
    font-style: italic;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  a.back {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  a.back:hover { text-decoration: underline; }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="wrap">

  <div class="header">
    <h1>Cleaning.</h1>
    <span class="date" id="today"></span>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-label">Progress</span>
      <span class="progress-count" id="progress-count">0 / 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="celebrate" id="celebrate-msg"></div>
  </div>

  <div class="grid" id="timer-grid"></div>

  <footer><a class="back" href="index.html">← Dashboard</a></footer>
</div>

<script>
const ACTIVITIES = [
  { id: 'makebed',   label: 'Make bed',              color: '#6c5ce7', minutes: 5,  note: 'Just the bed. Nothing else.' },
  { id: 'homein',    label: 'Coming home',           color: '#a89cf7', minutes: 5,  note: 'Shoes off, bag away, keys hung.' },
  { id: 'kitchen',   label: 'Kitchen / dishwasher',  color: '#10b981', minutes: 15, note: 'Load or unload dishwasher, wipe stove.' },
  { id: 'countersink', label: 'Counter / sink',      color: '#0ea5e9', minutes: 15, note: 'Wipe counters, clean sink.' },
  { id: 'bathroom',  label: 'Bathroom counter / toilet', color: '#2563eb', minutes: 15, note: 'Counter, mirror, toilet.' },
  { id: 'shower',    label: 'Shower / floor',        color: '#3a5478', minutes: 15, note: 'Shower walls, floor, bath mat.' },
  { id: 'laundry',   label: 'Laundry fold & store',  color: '#c2750a', minutes: 15, note: 'Fold everything, put it away.' },
  { id: 'straight',  label: 'General straightening', color: '#db2777', minutes: 15, note: 'One room at a time.' },
];

let timers = {};
let doneSet = new Set();

function todayKey() {
  const d = new Date();
  return `clean-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function saveToday() {
  try { localStorage.setItem(todayKey(), JSON.stringify([...doneSet])); } catch(e) {}
}
function loadToday() {
  try {
    const raw = localStorage.getItem(todayKey());
    if (raw) JSON.parse(raw).forEach(id => doneSet.add(id));
  } catch(e) {}
}

function renderProgress() {
  const total = ACTIVITIES.length;
  const done = doneSet.size;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-count').textContent = `${done} / ${total}`;
  if (pct === 100) {
    document.getElementById('celebrate-msg').textContent = 'All done!';
    launchConfetti();
  }
}

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = Array.from({ length: 100 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height,
    w: Math.random() * 10 + 5,
    h: Math.random() * 5 + 3,
    color: ['#a89cf7','#10b981','#0ea5e9','#db2777','#c2750a','#6c5ce7'][Math.floor(Math.random()*6)],
    rot: Math.random() * 360,
    vx: (Math.random() - 0.5) * 3,
    vy: Math.random() * 4 + 2,
    vr: (Math.random() - 0.5) * 6,
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.05;
    });
    frame++;
    if (frame < 180) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

function fmt(seconds) {
  return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
}

function tick(id) {
  const t = timers[id];
  if (t.remaining <= 0) {
    clearInterval(t.intervalId);
    t.status = 'idle';
    document.getElementById(`disp-${id}`).classList.remove('running');
    document.getElementById(`disp-${id}`).classList.add('done-time');
    document.getElementById(`disp-${id}`).textContent = 'Done!';
    document.getElementById(`start-${id}`).textContent = 'Restart';
    markDone(id, true);
    return;
  }
  t.remaining--;
  document.getElementById(`disp-${id}`).textContent = fmt(t.remaining);
}

function toggleTimer(id) {
  const t = timers[id];
  const btn = document.getElementById(`start-${id}`);
  const disp = document.getElementById(`disp-${id}`);
  if (t.status === 'running') {
    clearInterval(t.intervalId);
    t.status = 'paused';
    btn.textContent = 'Resume';
    disp.classList.remove('running');
  } else {
    if (t.remaining === 0) {
      t.remaining = ACTIVITIES.find(a => a.id === id).minutes * 60;
      disp.classList.remove('done-time');
    }
    t.status = 'running';
    btn.textContent = 'Pause';
    disp.classList.add('running');
    disp.textContent = fmt(t.remaining);
    t.intervalId = setInterval(() => tick(id), 1000);
  }
}

function resetTimer(id) {
  const t = timers[id];
  clearInterval(t.intervalId);
  t.remaining = ACTIVITIES.find(a => a.id === id).minutes * 60;
  t.status = 'idle';
  const disp = document.getElementById(`disp-${id}`);
  disp.classList.remove('running', 'done-time');
  disp.textContent = fmt(t.remaining);
  document.getElementById(`start-${id}`).textContent = 'Start';
}

function markDone(id, val) {
  const check = document.getElementById(`check-${id}`);
  const card = document.getElementById(`card-${id}`);
  if (val) {
    doneSet.add(id);
    check.classList.add('active');
    check.textContent = '✓';
    card.classList.add('done');
  } else {
    doneSet.delete(id);
    check.classList.remove('active');
    check.textContent = '';
    card.classList.remove('done');
  }
  saveToday();
  renderProgress();
}

function toggleDone(id) { markDone(id, !doneSet.has(id)); }

function buildCards() {
  const grid = document.getElementById('timer-grid');
  ACTIVITIES.forEach(act => {
    timers[act.id] = { remaining: act.minutes * 60, status: 'idle', intervalId: null };
    const isDone = doneSet.has(act.id);
    const card = document.createElement('div');
    card.className = 'card' + (isDone ? ' done' : '');
    card.id = `card-${act.id}`;
    card.style.setProperty('--card-color', act.color);
    card.innerHTML = `
      <div class="card-top">
        <div class="card-title"><span class="swatch"></span>${act.label}</div>
        <button class="done-check ${isDone ? 'active' : ''}" id="check-${act.id}">${isDone ? '✓' : ''}</button>
      </div>
      <div class="timer-display" id="disp-${act.id}">${fmt(act.minutes * 60)}</div>
      <div class="timer-controls">
        <button class="btn btn-start" id="start-${act.id}">Start</button>
        <button class="btn btn-reset" id="reset-${act.id}">Reset</button>
      </div>
      ${act.note ? `<div class="card-note">${act.note}</div>` : ''}
    `;
    grid.appendChild(card);
    card.querySelector(`#check-${act.id}`).addEventListener('click', () => toggleDone(act.id));
    card.querySelector(`#start-${act.id}`).addEventListener('click', () => toggleTimer(act.id));
    card.querySelector(`#reset-${act.id}`).addEventListener('click', () => resetTimer(act.id));
  });
}

document.getElementById('today').textContent = new Date().toLocaleDateString('en-US', {
  weekday: 'long', month: 'long', day: 'numeric'
});
loadToday();
buildCards();
renderProgress();
</script>
</body>
</html>
